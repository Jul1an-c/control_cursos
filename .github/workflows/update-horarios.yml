name: Actualizar horarios USAC

on:
  schedule:
    - cron: '0 6 * * *'   # Todos los días a las 06:00 UTC
  workflow_dispatch:       # Permite ejecutarlo manualmente

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Descargar y procesar horarios
        run: node scripts/fetch_horarios.js

      - name: Commitear cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/horarios/
          if git diff --staged --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Auto-update horarios USAC"
            git push
          fi
